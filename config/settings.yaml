# Signal Candle Jengat - Configuration
# Copy to .env for secrets or use environment variables

# ============================================
# EXCHANGE & MARKET DATA SETTINGS
# ============================================
exchange:
  name: "binance"
  # No API key needed for public market data
  # api_key: ""
  # api_secret: ""
  # Rate limit handling
  enable_rate_limit: true
  timeout: 30000  # ms

# ============================================
# TRADING PARAMETERS
# ============================================
trading:
  # Symbols to monitor (Binance format: BASE/QUOTE)
  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
    - "BNB/USDT"
    - "SOL/USDT"
    - "XRP/USDT"

  # Timeframe for candles (ccxt format: 1m, 5m, 15m, 30m, 1h, 4h, 1d)
  timeframe: "1h"

  # Number of candles to fetch (need at least 35 for indicators + lookback)
  fetch_limit: 100

# ============================================
# STRATEGY PARAMETERS (Momentum Range Breakout)
# ============================================
strategy:
  # 1. Strong Body: Real body >= X% of full candle range
  strong_body_pct: 0.75  # 75%

  # 2. Volatility Expansion: Candle range >= X * 14-period SMA of ranges
  volatility_multiplier: 1.2

  # 3. Base Breakout Lookback Periods
  breakout_lookback: 20  # Previous N candles for high/low

  # 4. Indicators Periods
  atr_period: 14
  range_sma_period: 14

# ============================================
# FIBONACCI EXECUTION LEVELS
# ============================================
fibonacci:
  # Pullback entry (0.236 retracement from high/low)
  entry_retrace: 0.236

  # Stop Loss buffer (0.10 * ATR)
  sl_atr_multiplier: 0.10

  # Take Profit extension (-0.27 Fib extension)
  tp_extension: 0.27

# ============================================
# STATE MANAGEMENT
# ============================================
state:
  # Persist state to file (survives restarts)
  persist_enabled: true
  persist_file: "data/bot_state.json"

  # Prevent consecutive signals until active trade hits TP/SL
  prevent_consecutive_signals: true

  # Track active trades per symbol
  track_active_trades: true

# ============================================
# SCHEDULER SETTINGS
# ============================================
scheduler:
  # Buffer seconds after candle close before processing
  buffer_seconds: 3

  # Max sleep time per iteration (safety)
  max_sleep_seconds: 3600

  # Timezone for logging (IANA format)
  timezone: "UTC"

# ============================================
# NOTIFICATION SETTINGS
# ============================================
notifications:
  telegram:
    enabled: true
    # Set via environment variables: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
    # bot_token: ""
    # chat_id: ""
    parse_mode: "Markdown"
    timeout: 10  # seconds

  discord:
    enabled: true
    # Set via environment variable: DISCORD_WEBHOOK_URL
    # webhook_url: ""
    timeout: 10  # seconds
    # Embed color (decimal)
    embed_color_buy: 3066993    # Green
    embed_color_sell: 15158332  # Red
    embed_color_info: 3447003   # Blue

# ============================================
# LOGGING SETTINGS
# ============================================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  # File logging
  file_enabled: true
  file_path: "logs/bot.log"
  file_max_bytes: 10485760  # 10 MB
  file_backup_count: 5
  # Console logging
  console_enabled: true

# ============================================
# RETRY & ERROR HANDLING
# ============================================
retry:
  max_attempts: 3
  base_delay: 1.0  # seconds
  max_delay: 60.0  # seconds
  exponential_base: 2
  jitter: true