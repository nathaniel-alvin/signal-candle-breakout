  #     - ./logs:/logs:rw
  #   environment:
  #     - LOGROTATE_CRON=0 0 * * *
  #     - LOGROTATE_MAXSIZE=10M
  #     - LOGROTATE_MAXAGE=30
  #     - LOGROTATE_COMPRESS=true