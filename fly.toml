app = "signal-candle-jengat"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  TZ = "UTC"

[processes]
  app = "python main.py"

# No HTTP service needed - this is a background worker
[[services]]
  protocol = "tcp"
  internal_port = 8080
  ports = []

# Health check not needed for background worker
# [checks] not configured

[metrics]
  port = 9090
